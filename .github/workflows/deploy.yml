name: Deploy & Notify

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        run: |
          echo "Auto-deploy triggered by push to master"
          echo "Deploying to ${VPS_HOST} as ${VPS_USER}"
          ssh -o StrictHostKeyChecking=no -p 22 ${VPS_USER}@${VPS_HOST} "cd ${WORKTREE_FOLDER} && git pull && docker compose pull && docker compose up -d"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          WORKTREE_FOLDER: ${{ secrets.WORKTREE_FOLDER }}

      - name: Notify
        run: |
          echo "Deployment complete! Commit: ${{ github.sha }}"
          echo "Pushed by: ${{ github.actor }}"
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
